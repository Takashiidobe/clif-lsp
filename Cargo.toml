[workspace]
members = ["xtask"]

[package]
name = "clif-lsp"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
cranelift-codegen = "=0.136.2"
cranelift-reader = "=0.136.2"
filecheck = "0.5.0"

[[test]]
name = "fixtures"
harness = false

[dependencies]
ropey = "1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp-server = "0.23"
