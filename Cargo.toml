[workspace]
members = ["xtask"]

[package]
name = "clif-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Language server for Cranelift IR (CLIF) text files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Takashiidobe/clif-lsp"
keywords = ["lsp", "cranelift", "clif", "language-server"]
categories = ["development-tools"]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE-*"]

[dev-dependencies]
filecheck = "0.5.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["io-util", "time", "rt"] }

[[test]]
name = "fixtures"
harness = false

[dependencies]
cranelift-codegen = "=0.136.2"
cranelift-reader = "=0.136.2"
ropey = "1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp-server = "0.23"
